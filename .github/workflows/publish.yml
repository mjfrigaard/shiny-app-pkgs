name: publish

on:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'latest'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R dependencies
        run: |
          install.packages(c("devtools", "rmarkdown", "knitr"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Render book
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_book'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
